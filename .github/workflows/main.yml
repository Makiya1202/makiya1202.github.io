name: Deploy to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Patch
        env:
          A25BE2: ${{ secrets.A25BE2 }}
          BD0218: ${{ secrets.BD0218 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          tag_a = os.environ.get('A25BE2', '')
          tag_b = os.environ.get('BD0218', '')
          fpath = pathlib.Path('index.html')
          orig = fpath.read_text(encoding='utf-8')
          updated = orig
          if tag_a:
              updated = updated.replace('<!-- 87f2eb44cac904279fcc723b725539 -->', tag_a)
          if tag_b:
              updated = updated.replace('<!-- a7182d640ef4ebef7b29ca3569e8d610eb264bc21c21 -->', tag_b)
          if updated == orig and (tag_a or tag_b):
              sys.exit(1)
          if updated != orig:
              fpath.write_text(updated, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
